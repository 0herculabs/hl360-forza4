# FM4 runtime defaults. macOS builds select Vulkan; Metal staging selects Metal.
gpu_backend = "d3d12"
vsync = true
readback_resolve = "fast"
audio_maxqframes = 16
async_shader_compilation = false
gpu_allow_invalid_fetch_constants = true
execute_unclipped_draw_vs_on_cpu = true

# Diagnostics are opt-in through the game command line.
frame_stats = false

# Optional host presentation cap; guest timing is unchanged.
fm4_frame_limit = 0
controller_vibration = false
