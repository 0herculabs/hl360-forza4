# Defaults adapted from the local FM4 Xenia Canary profile.
# Keep guest vblank pacing enabled: this runtime ties it to vsync.
gpu_backend = "d3d12"
vsync = true
readback_resolve = "none"
readback_memexport = false
audio_maxqframes = 16
async_shader_compilation = true
gpu_allow_invalid_fetch_constants = true
execute_unclipped_draw_vs_on_cpu = true

# Diagnostics are opt-in through the game command line.
frame_stats = false
